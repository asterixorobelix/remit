# Spell-check allowlist for `typos` (used by the agent edit hook).
[default.extend-words]
itms = "itms"           # itms-apps:// App Store URL scheme
prodution = "prodution" # deliberate misspelling in AppConfigTest
Caf = "Caf"             # percent-encoded "Café" in FeedbackUseCasesTest
udid = "udid"           # simulator device identifier (xcrun simctl)
UDID = "UDID"
Asserion = "Asserion"   # JMeter's own property name (Asserion.test_strings) in perf/payments.jmx

[files]
# Generated Baseline Profiles (`make baseline-profile`): JVM method signatures such as `([IZ)V`.
extend-exclude = ["mobile/androidApp/src/*/generated/baselineProfiles/"]
