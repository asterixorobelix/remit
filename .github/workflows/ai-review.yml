# AI review — PR-Agent (open source) with any model through OpenRouter, so the reviewer is not
# tied to the vendor of the coding agent that wrote the pull request.
#
# Setup: add an OPENROUTER_API_KEY secret. Optionally set the AI_REVIEW_MODEL repository variable
# to any OpenRouter model id with an "openrouter/" prefix (default below). Without the secret the
# check passes and does nothing, so projects that skip AI review are never blocked.
#
# Behaviour (settings in .pr_agent.toml):
# - Opened / ready for review: a review summary comment plus committable suggestions. Suggestions
#   are review threads, and branch protection requires resolving every thread before merging.
# - Later pushes refresh the review summary only.
# - A "Possible security concern" label fails this check until a maintainer reviews the change
#   and removes the label (then re-run the check).
# - Maintainers can comment /review, /improve, /ask "...", or /describe on a pull request.
# Cost: one short Linux job per event plus model tokens (cents per review with the default).

name: AI review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Secrets stay in step-level env (never workflow-level), so only the PR-Agent steps see them.
env:
  CONFIG.MODEL: ${{ vars.AI_REVIEW_MODEL || 'openrouter/google/gemini-3.8-flash' }}
  CONFIG.FALLBACK_MODELS: '["openrouter/auto"]'
  # Token limit for models PR-Agent does not know by name (most OpenRouter ids).
  CONFIG.CUSTOM_MODEL_MAX_TOKENS: '200000'

jobs:
  review:
    name: AI review
    # Drafts are reviewed when marked ready. Dependabot PRs get no secrets, so they are skipped.
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      HAS_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - name: Check for an OpenRouter key
        if: env.HAS_OPENROUTER_KEY != 'true'
        run: echo "::notice::Add an OPENROUTER_API_KEY secret to enable AI review."
      - name: Review
        if: env.HAS_OPENROUTER_KEY == 'true'
        uses: docker://pragent/pr-agent@sha256:31b9aac6ab067bada9a0c1b001d30ebc500ea4487e00a93c18c59b9ef5fa66db # 0.47.0-github_action
        env:
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'true'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
      - name: Stop on a security concern
        if: env.HAS_OPENROUTER_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if grep -qx 'Possible security concern' <<< "$labels"; then
            echo "::error::AI review flagged a possible security concern. A maintainer must check it, remove the label, and re-run this check."
            exit 1
          fi

  command:
    name: AI review command
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      HAS_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - name: Run the command
        if: env.HAS_OPENROUTER_KEY == 'true'
        uses: docker://pragent/pr-agent@sha256:31b9aac6ab067bada9a0c1b001d30ebc500ea4487e00a93c18c59b9ef5fa66db # 0.47.0-github_action
        env:
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
