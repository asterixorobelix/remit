# CodeQL — weekly Java/Kotlin security analysis of the backend and mobile code.
#
# Code scanning is free on public repositories but needs GitHub Code Security on private ones.
# A short preflight job checks that it is available, so a private repository without it
# spends one Linux minute a week instead of running analyses whose upload would fail.
# Swift is not analyzed: the iOS app is a thin SwiftUI shell around the shared Kotlin code,
# and Swift analysis needs a macOS runner (10x minutes).

name: CodeQL

on:
  schedule:
    - cron: '20 19 * * 1'  # Mondays 19:20 UTC
  workflow_dispatch:

concurrency:
  group: codeql
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Check code scanning
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      security-events: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check that code scanning is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 200 (alerts) or 404 (no analysis yet) mean code scanning is available.
          status="$(gh api --include "repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=1" 2>/dev/null \
            | awk 'NR == 1 { print $2 }' || true)"
          case "$status" in
            200|404) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::Code scanning is not available (HTTP ${status:-error}). Enable GitHub Code Security to analyze a private repository."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  analyze:
    name: Analyze (${{ matrix.project }})
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: backend
            java: '17'
            tasks: classes
          - project: mobile
            java: '21'
            tasks: >-
              :composeApp:compileKotlinDesktop :composeApp:compileAndroidMain
              :androidApp:compileDebugKotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads CI's dependency cache; this job never saves one.
      - uses: ./.github/actions/java-gradle
        with:
          java-version: ${{ matrix.java }}
          project-dir: ${{ matrix.project }}
          cache-id: ${{ matrix.project }}
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
      # CodeQL only sees code that is actually compiled under its tracer: no build cache,
      # and the Kotlin compiler runs inside the traced Gradle process.
      - name: Compile
        working-directory: ${{ matrix.project }}
        env:
          TASKS: ${{ matrix.tasks }}
        run: |
          # shellcheck disable=SC2086 # TASKS is a space-separated task list
          ./gradlew $TASKS --no-daemon --no-build-cache --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin-${{ matrix.project }}
