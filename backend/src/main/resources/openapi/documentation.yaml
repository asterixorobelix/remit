openapi: 3.0.3
info:
  title: Remit API
  description: |
    Backend for the Remit mobile apps.

    * Every error uses the `ErrorResponse` shape. Send `X-Request-ID` (8-128 characters from
      `[A-Za-z0-9._-]`) to correlate logs; the server generates one otherwise and echoes it back.
  version: 1.0.0
servers:
  - url: /
    description: This server

tags:
  - name: System
    description: Liveness, service metadata, and remote app configuration
  - name: Payments
    description: Send a payment; processed payments are recorded in Firestore for the app's history

paths:
  /:
    get:
      tags: [System]
      summary: Service info
      operationId: getServiceInfo
      responses:
        '200':
          description: Service name and version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfoResponse'

  /health:
    get:
      tags: [System]
      summary: Liveness probe
      description: Returns 200 while the process is running.
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/status:
    get:
      tags: [System]
      summary: API status
      operationId: getApiStatus
      responses:
        '200':
          description: API status and version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/v1/config:
    get:
      tags: [System]
      summary: Remote app configuration
      description: Version gates and maintenance flags for mobile clients (MIN_APP_VERSION, LATEST_APP_VERSION, FORCE_UPDATE, MAINTENANCE_MODE).
      operationId: getRemoteConfig
      responses:
        '200':
          description: Remote configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'

  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Send a payment
      description: |
        Validates and processes a payment (the processor is a mock that completes every valid
        payment), then records it in Firestore under the caller's user id, where the app's
        history listens for it.

        Idempotent: each `Idempotency-Key` is processed once per user. Repeating a key with the
        same body returns the original payment (201, `Idempotent-Replayed: true`); repeating it
        with a different body is a 409. Amounts are JSON numbers read exactly, never as floating
        point: `10.50` USD is 1050 cents, and an amount with more decimals than the currency allows
        is rejected, not rounded.
      operationId: createPayment
      security:
        - firebaseIdToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A unique key per payment, reused on retries (for example a UUID)
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,255}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              recipientEmail: bob@example.com
              amount: 10.50
              currency: USD
      responses:
        '201':
          description: Payment processed (or the original payment, when replayed)
          headers:
            Idempotent-Replayed:
              description: '`true` when this is the stored response for a repeated key'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: |
            Invalid payment (`code` VALIDATION_FAILED, `details` lists the problems), missing or
            malformed `Idempotency-Key` (IDEMPOTENCY_KEY_MISSING, IDEMPOTENCY_KEY_INVALID), or a
            body that is not valid JSON (for example a quoted amount)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid payment
                code: VALIDATION_FAILED
                details: [AMOUNT_TOO_MANY_DECIMALS, EMAIL_INVALID]
        '401':
          description: Missing or invalid Firebase ID token (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The key was already used for a different payment (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The server has no Firebase project configured (PAYMENTS_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message; only validation messages are specific
        code:
          type: string
          description: Stable machine-readable reason, when the endpoint defines one
        details:
          type: array
          items:
            type: string
            enum: [EMAIL_BLANK, EMAIL_TOO_LONG, EMAIL_INVALID, AMOUNT_BLANK, AMOUNT_NOT_A_NUMBER,
              AMOUNT_NOT_POSITIVE, AMOUNT_TOO_MANY_DECIMALS, AMOUNT_ABOVE_LIMIT, CURRENCY_MISSING,
              CURRENCY_UNSUPPORTED]
          description: Validation problems, one per field

    CreatePaymentRequest:
      type: object
      properties:
        recipientEmail:
          type: string
          format: email
          maxLength: 254
        amount:
          type: number
          description: Positive, at most the currency's decimal places, at most 10000
          example: 10.50
        currency:
          type: string
          enum: [USD, EUR]

    PaymentResponse:
      type: object
      required: [id, recipientEmail, amount, currency, status, createdAt]
      properties:
        id:
          type: string
          example: pay_3f6c2b1e9d8a4c7f8e2b5a1d0c9e7f6a
        recipientEmail:
          type: string
          description: Trimmed and lower-cased
        amount:
          type: number
          description: Always with the currency's decimal places, for example 10.50
        currency:
          type: string
          enum: [USD, EUR]
        status:
          type: string
          enum: [COMPLETED]
        createdAt:
          type: string
          format: date-time

    ServiceInfoResponse:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: remit
        version:
          type: string
          example: 1.0.0

    HealthResponse:
      type: object
      required: [status, timestamp, version]
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: integer
          format: int64
          description: Server time in epoch milliseconds
        version:
          type: string
          description: Release version from app.properties
          example: 1.0.0

    StatusResponse:
      type: object
      required: [api, version]
      properties:
        api:
          type: string
          example: running
        version:
          type: string
          example: 1.0.0

    AppConfigResponse:
      type: object
      required: [minVersion, latestVersion, forceUpdate, maintenanceMode]
      properties:
        minVersion:
          type: string
          example: 0.0.0
        latestVersion:
          type: string
          example: 1.0.0
        forceUpdate:
          type: boolean
        maintenanceMode:
          type: boolean
