# Docker Compose for local development.
#
#   docker compose up -d --build   # the backend at http://localhost:8085
#   docker compose logs -f backend # follow the logs
#   docker compose down            # stop
#
# The backend runs with APP_ENVIRONMENT=development (Swagger UI at /swagger, localhost CORS
# origins). The image itself defaults to production. Do not deploy this file as-is.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENVIRONMENT: development
      # Clients connect directly (no reverse proxy), so X-Forwarded-For is not trusted.
      TRUSTED_PROXY_HOPS: "0"
    ports:
      - "8085:8085"
